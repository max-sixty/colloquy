<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="colloquy">
<!-- A page with one line marked and a comment in its margin: the gesture the
     whole product is. Transparent, and the two palettes are the values
     theme.css states for paper, ink, accent and the mark, spelled out because a
     favicon cannot link a stylesheet. -->
<style>
  .page { fill: #fbfbf9; stroke: #626b78; }
  .line { stroke: #626b78; }
  .mark { stroke: #fde68a; }
  .note { fill: #2563eb; }
  @media (prefers-color-scheme: dark) {
    .page { fill: #16181d; stroke: #9aa3ad; }
    .line { stroke: #9aa3ad; }
    .mark { stroke: #a1852a; }
    .note { fill: #60a5fa; }
  }
</style>
<rect class="page" x="3.5" y="3.5" width="18" height="25" rx="2.5"
      stroke-width="2"/>
<path class="mark" d="M8 16 h9" stroke-width="4" stroke-linecap="round"/>
<g class="line" stroke-width="2" stroke-linecap="round">
  <path d="M8 10 h9"/>
  <path d="M8 16 h9"/>
  <path d="M8 22 h5"/>
</g>
<path class="note" d="M23 11 h6 a2 2 0 0 1 2 2 v5 a2 2 0 0 1 -2 2 h-3 l-3 3 v-3
      a2 2 0 0 1 -2 -2 v-5 a2 2 0 0 1 2 -2 z"/>
</svg>
