name: ci

# The two gates `wt merge` already runs locally (`.config/wt.toml`), run again
# where that hook never reaches: a pull request, and any push that didn't come
# through `wt merge`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      # The suite runs uv offline (`tests/conftest.py` says why), so everything it
      # drives has to come from the cache, and `uv sync` fills it from `uv.lock`
      # alone. One thing lives outside that lock: the Playwright `bin/colloquy`
      # hands `version export` on top of its script header (it says why), which a
      # fresh cache has no resolution for. `--help` is that path doing nothing but
      # fetch one.
      #
      # Pinning it would not do instead. `uv sync` fetches wheels from the URLs in
      # `uv.lock` and never asks the index, so what a cold cache lacks for a
      # `--with` is the resolution, and it lacks that at any version.
      - name: 🌐 Fetch what uv.lock doesn't cache
        run: plugins/colloquy/bin/colloquy version export --help

      # Playwright then attaches to the runner's own Chrome (`channel="chrome"`),
      # the same one `publish-site` draws the examples with, so there is no
      # browser to install either.
      - name: 🧪 Test suite
        run: uv run pytest tests

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🔍 Pre-commit hooks
        uses: pre-commit/action@v3.0.1
